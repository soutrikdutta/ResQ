<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/resq-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a13" />
    <title>ResQ — AI-Powered Campus Resilience &amp; Resource Failover</title>
    <meta name="description" content="ResQ helps students and faculty find instant alternatives when campus resources fail—broken projectors, unavailable Wi-Fi, jammed printers, packed labs, or last-minute classroom relocations." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="ResQ — Campus Resilience & Resource Failover" />
    <meta property="og:description" content="ResQ finds the nearest verified backup when campus resources fail, and predicts bottlenecks before class starts." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved / system theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('resq-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
